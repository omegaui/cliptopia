name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Build Debian & AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            fuse \
            patchelf

      - name: Flutter Doctor
        run: |
          flutter --disable-analytics
          flutter doctor -v

      - name: Install flutter_to_debian
        run: dart pub global activate flutter_to_debian

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Uncomment if you have tests
      # - name: Test
      #   run: flutter test

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Build Debian Package
        run: flutter pub run flutter_to_debian:main

      - name: Build AppImage
        uses: docker://appimagecrafters/appimage-builder:0.8.5
        with:
          entrypoint: appimage-builder
          args: --recipe AppImageBuilder.yml --skip-test

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: Debian
          path: debian/packages/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: "*.AppImage"